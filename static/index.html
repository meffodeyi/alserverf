<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 500px;

            background: #1c1c1c;

            padding: 30px;

            border-radius: 20px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .status {
            text-align: center;

            margin-bottom: 25px;

            color: #aaa;
        }

        .colors {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        button {
            border: none;

            padding: 18px;

            border-radius: 12px;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.96);
        }

        .magenta {
            background: #ff0080;
        }

        .sky-blue {
            background: #4fc3f7;
        }

        .red {
            background: #ff2222;
        }

        .blue {
            background: #004cff;
        }

        .purple {
            background: #8a2be2;
        }

        .full {
            grid-column: span 2;
        }

        #result {
            text-align: center;

            margin-top: 20px;

            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ESP32 Control</h1>

    <div class="status">
        Выбери цвет сигнала
    </div>

    <div class="colors">

        <button
            class="magenta"
            onclick="trigger('magenta')">
            Маджента
        </button>

        <button
            class="sky-blue"
            onclick="trigger('sky_blue')">
            Небесно-голубой
        </button>

        <button
            class="red"
            onclick="trigger('red')">
            Красный
        </button>

        <button
            class="blue"
            onclick="trigger('blue')">
            Чисто синий
        </button>

        <button
            class="purple full"
            onclick="trigger('purple')">
            Фиолетовый
        </button>

    </div>

    <div id="result"></div>

</div>


<script>

async function trigger(color) {

    const result = document.getElementById("result");

    result.textContent = "Отправляем сигнал...";

    try {

        const response = await fetch("/api/trigger", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                color: color
            })

        });

        const data = await response.json();

        if (data.success) {

            result.textContent =
                "Сигнал отправлен: " + color;

        } else {

            result.textContent =
                "Ошибка: " + data.error;
        }

    } catch (error) {

        result.textContent =
            "Ошибка соединения с сервером";

        console.error(error);
    }
}

</script>

</body>
</html>
